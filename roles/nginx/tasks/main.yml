---
# tasks file for roles/nginx

- name: update cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: install and configure nginx
  ansible.builtin.apt:
    name: nginx
    state: present
  tags: [never,nginx]
  

- name: start and enable nginx
  service:
    name: nginx
    state: started
    enabled: true
  tags: [never,nginx]

- name: copy nginx configuration files
  template:
    src: wordpress.conf.j2
    dest: /etc/nginx/sites-enabled/wordpress.conf.j2
  notify: restart nginx
  tags: [never,nginx]

- name: remove default nginx configuration
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx
  tags: [never,nginx]


  

